[package]
name = "league-auto-accept"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A focused Windows utility for League of Legends ready checks (Rust + GPUI rewrite)."
license = "MIT"
publish = false

[dependencies]
# gpui-kit re-exports the pinned GPUI (gpui-pre) snapshot as its own root (`pub use ::gpui::*`)
# plus `application`/`open_window`/`init`. Aliasing the package to `gpui` keeps `use gpui::…`
# imports working while switching the foundation to the gpui-base-compatible snapshot.
gpui = { package = "gpui-kit", version = "0.7", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
sha1 = "0.10"
base64 = "0.22"
rand = "0.9"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.25"
muda = "0.20"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rcgen = "0.13"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
